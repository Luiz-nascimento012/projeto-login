<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login básico</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/medias.css" media="all">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <main>
        <section class="login">
            <div id="main-img"></div>
            <div id="formulario">
                <h1>Login</h1>
                <p>que bom ter você de volta! conecte e fique junto conosco para criar as novas funções do nosso novo site!</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-icons">person</span>
                        <input type="email" name="email" id="iemail" required placeholder="seu e-mail" autocomplete="email">
                        <label for="iemail"></label>
                    </div>
                    <div class="campo">
                        <span class="material-icons">key</span>
                        <input type="password" name="senha" id="isenha" placeholder="senha" required minlength="5" maxlength="20" autocomplete="current-password">
                        <label for="isenha"></label>
                    </div>
                    <button class="entrar" type="submit">conectar</button>
                    <button class="forget" type="submit">esqueceu a senha?</button>
                </form>
            </div>

        </section>
    </main>
</body>
</html>
